version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # One PR per ecosystem rather than per package — a monorepo generates far
      # too much noise otherwise.
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: "/apps/api"
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: monthly
