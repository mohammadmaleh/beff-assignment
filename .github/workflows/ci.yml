name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beff
          POSTGRES_PASSWORD: beff
          POSTGRES_DB: beff_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}

      # --frozen fails if uv.lock is out of date with pyproject.toml, so a
      # dependency change without a relock cannot slip through.
      - run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+asyncpg://beff:beff@localhost:5432/beff_test
          JWT_SECRET: ci_only_secret
          IP_HASH_SALT: ci_only_salt

  frontend:
    name: Frontend — lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Audits report but do not block (`|| true`). Transitive advisories with no
  # available fix would otherwise wedge the pipeline on someone else's release
  # schedule. Findings are reviewed in ENG-41 and this becomes blocking once the
  # baseline is clean.
  security:
    name: Security — dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9
      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Python dependency audit
        working-directory: apps/api
        run: |
          uv sync --frozen --all-groups
          uv run --with pip-audit pip-audit || true

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Node dependency audit
        run: pnpm audit --audit-level high || true
