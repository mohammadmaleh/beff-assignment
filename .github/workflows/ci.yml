name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend - lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beff
          POSTGRES_PASSWORD: beff
          POSTGRES_DB: beff_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}

      # --frozen fails if uv.lock is out of date with pyproject.toml, so a
      # dependency change without a relock cannot slip through.
      - run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+asyncpg://beff:beff@localhost:5432/beff_test
          JWT_SECRET: ci_only_secret
          IP_HASH_SALT: ci_only_salt

  # ENG-33. Lives in its own job because it needs *both* toolchains: `uv` to ask
  # the FastAPI app for its OpenAPI document, and Node to render it. Bolting it
  # onto either of the others would make that job's setup lie about what it is.
  api-client:
    name: API client - no drift from the OpenAPI schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-groups

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      # Regenerates from the live schema and fails if the committed client
      # differs. No database and no running server: the schema is built from the
      # app object, so this cannot flake on infrastructure.
      - name: Check for drift
        run: pnpm --filter @beff/api-client check:drift
        working-directory: .

  frontend:
    name: Frontend - lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The automated half of the accessibility gate, plus the keyboard flows axe
  # cannot check. Scoped to the surfaces that render without the API, so this
  # job needs no database - the authenticated flows are ENG-39's remaining half.
  e2e:
    name: E2E - accessibility and keyboard, Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only Chromium. WebKit and mobile are on the documented cut list, and
      # downloading three engines to run one is ten minutes of CI for nothing.
      - run: pnpm --filter @beff/e2e exec playwright install --with-deps chromium

      - run: pnpm build

      - run: pnpm --filter @beff/e2e test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7

  # These now **block**. They used to end in `|| true`, which meant the job was
  # green whatever it found - a notification nobody reads, dressed as a gate.
  #
  # The baseline was made clean first, because turning on a gate that is already
  # failing just teaches people to ignore it. `pnpm audit` reported five
  # transitive advisories (postcss ×3, sharp, brace-expansion) reachable only
  # through `next` and `eslint`; they are pinned to patched versions by
  # `pnpm.overrides` in the root package.json. `pip-audit` was already clean.
  #
  # The original worry - a transitive advisory with no fix wedging the pipeline
  # on someone else's release schedule - is real, and the answer is an override
  # entry with a comment, not a permanently disarmed gate. Read the note in
  # package.json before adding one: cap the range to a single major.
  security:
    name: Security - dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Python dependency audit
        working-directory: apps/api
        run: |
          uv sync --frozen --all-groups
          uv run --with pip-audit pip-audit

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # `--frozen-lockfile` before auditing: the audit resolves against the
      # lockfile, and this also proves the lockfile matches the `overrides`
      # block rather than having drifted from it.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Blocking at `high`. The tree is clean at every level today, but `high`
      # is the threshold worth failing a build over - a moderate advisory in a
      # build-time dependency should not stop a deploy at 2am.
      - name: Node dependency audit
        run: pnpm audit --audit-level high

      # Non-blocking, and deliberately so: this is the early warning that a
      # moderate advisory has appeared, visible in the log without failing
      # anything.
      - name: Node dependency audit - full report
        if: always()
        run: pnpm audit || true
