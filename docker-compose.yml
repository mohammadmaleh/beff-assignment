# Local development stack. One command, no manual steps:
#   docker compose up
#
# Production uses managed services (Neon, Upstash, Fly, Vercel) — this file is
# for local parity, not deployment.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beff_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-beff}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Depends on postgres being ready to accept connections, not just the
      # container being up — otherwise the API races it on startup.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beff} -d ${POSTGRES_DB:-beff}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-beff}:${POSTGRES_PASSWORD:-beff_dev_password}@postgres:5432/${POSTGRES_DB:-beff}
      JWT_SECRET: ${JWT_SECRET:-dev_only_do_not_use_in_production}
      IP_HASH_SALT: ${IP_HASH_SALT:-dev_only_salt}
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: development
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy

  # The `worker` service arrives with ENG-31, when there are jobs for it to run.
  # It is deliberately absent rather than stubbed — a service that crash-loops
  # on a missing module makes `docker compose up` look broken to a reviewer.
  # It will poll Postgres with FOR UPDATE SKIP LOCKED; no Redis (ADR-0006).

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: development
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      # Preserve node_modules installed by pnpm in the image — the bind-mounts
      # above would otherwise overwrite them with the (possibly empty) host dirs.
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/config/node_modules
      - /app/packages/tokens/node_modules
      - /app/packages/ui/node_modules
    depends_on:
      - api

volumes:
  postgres-data:
