# Local development stack. One command, no manual steps:
#   docker compose up
#
# Production uses managed services (Neon, Upstash, Fly, Vercel) - this file is
# for local parity, not deployment.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beff_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-beff}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Depends on postgres being ready to accept connections, not just the
      # container being up - otherwise the API races it on startup.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-beff} -d ${POSTGRES_DB:-beff}']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: migrate, then seed the demo account, then exit. `api` and `worker`
  # wait for it to complete.
  #
  # A separate service rather than a startup hook on `api`, because migrations
  # and serving are different concerns with different failure modes - a failed
  # migration should stop the stack with a readable error, not put the API into
  # a crash loop. It is also the shape that survives more than one API replica,
  # where N containers racing to migrate on boot is a genuine hazard.
  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: dev
    command:
      - sh
      - -c
      - 'uv run --no-sync alembic upgrade head && uv run --no-sync python -m beff.seed'
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-beff}:${POSTGRES_PASSWORD:-beff_dev_password}@postgres:5432/${POSTGRES_DB:-beff}
      JWT_SECRET: ${JWT_SECRET:-dev_only_do_not_use_in_production}
      IP_HASH_SALT: ${IP_HASH_SALT:-dev_only_salt}
      ENVIRONMENT: development
    volumes:
      - ./apps/api/src:/app/src
      # `alembic.ini` and `migrations/` are mounted here and nowhere else. The
      # API image deliberately does not carry them: a running API has no reason
      # to be able to rewrite the schema it is serving.
      - ./apps/api/alembic.ini:/app/alembic.ini:ro
      - ./apps/api/migrations:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-beff}:${POSTGRES_PASSWORD:-beff_dev_password}@postgres:5432/${POSTGRES_DB:-beff}
      JWT_SECRET: ${JWT_SECRET:-dev_only_do_not_use_in_production}
      IP_HASH_SALT: ${IP_HASH_SALT:-dev_only_salt}
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: development
      # Where the confirmation link points. Not NEXT_PUBLIC_SITE_URL: Next
      # inlines that at build time, so it does not exist in this process.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # Deliberately empty by default. No SMTP host means the worker logs each
      # message instead of sending it, so `docker compose up` completes the
      # registration flow with no mail account - the link is printed in full in
      # the worker log, which is the only place a local developer can get it.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-Beff <no-reply@beff.example>}
    ports:
      - '${API_PORT:-8000}:8000'
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Drains the export queue *and* the email outbox. Polls Postgres with
  # `FOR UPDATE SKIP LOCKED` - no Redis, no Celery (ADR-0006). Without this
  # service an export requested from the profile screen stays `pending` forever
  # and no confirmation email is ever sent, which is the failure mode a reviewer
  # notices last and trusts least.
  #
  # Same image as `api`, different command: the worker shares the models, the
  # repositories and the service, and building a second image for one entry
  # point would guarantee they drift.
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: dev
    command: ['uv', 'run', '--no-sync', 'python', '-m', 'beff.worker']
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-beff}:${POSTGRES_PASSWORD:-beff_dev_password}@postgres:5432/${POSTGRES_DB:-beff}
      JWT_SECRET: ${JWT_SECRET:-dev_only_do_not_use_in_production}
      IP_HASH_SALT: ${IP_HASH_SALT:-dev_only_salt}
      ENVIRONMENT: development
      # The worker is the process that actually sends, so these matter here more
      # than they do on `api`. Same defaults, same console fallback.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-Beff <no-reply@beff.example>}
    volumes:
      - ./apps/api/src:/app/src
    # `SKIP LOCKED` means a second replica steps over whatever the first has
    # claimed rather than blocking behind it, so scaling this is `--scale
    # worker=3` and nothing else.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: development
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      # Preserve node_modules installed by pnpm in the image - the bind-mounts
      # above would otherwise overwrite them with the (possibly empty) host dirs.
      - /app/node_modules
      - /app/apps/web/node_modules
      # And keep the container's build output out of the host tree entirely.
      #
      # This container runs as root, so through the bind-mount above it wrote
      # `.next` back to the host owned by root - after which the *host's*
      # `pnpm dev`, running as an ordinary user, could not create a directory
      # inside its own build output. Turbopack reports that as a FATAL panic
      # with a bug-report URL, which sends you looking for a Next.js bug rather
      # than a `chown`.
      #
      # An anonymous volume rather than `user:` on the service: the image
      # installs node_modules as root, so running the container as the host UID
      # trades this problem for an unwritable store. Two `.next` directories
      # that never meet is the honest model anyway - the container and the host
      # are running two different Next servers.
      - /app/apps/web/.next
      - /app/packages/config/node_modules
      - /app/packages/tokens/node_modules
      - /app/packages/ui/node_modules
    depends_on:
      - api

volumes:
  postgres-data:
