# Alembic configuration.
#
# The database URL is deliberately NOT set here - it comes from DATABASE_URL via
# `beff.core.config`, so there is exactly one source of truth and no credential
# is ever committed. `migrations/env.py` injects it.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Revisions are ordered by filename in the directory listing, so they carry a
# zero-padded sequence rather than only a hash.
file_template = %%(rev)s_%%(slug)s

# Timestamps in migrations are timezone-aware, matching the TIMESTAMPTZ rule.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
