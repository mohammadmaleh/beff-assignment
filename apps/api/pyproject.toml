[project]
name = "beff-api"
version = "0.1.0"
description = "Beff API — auth, onboarding, GDPR data subject rights, and production metrics."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "email-validator>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "alembic>=1.18.0",
    "asyncpg>=0.31.0",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.10.0",
    # No Redis, no Celery/arq. Background jobs run on a Postgres-backed queue
    # using SELECT ... FOR UPDATE SKIP LOCKED. At pre-launch volume that keeps
    # persistence, retries, idempotency and a dead-letter path without adding a
    # second datastore to run, deploy and monitor. See ADR-0006.
    "python-multipart>=0.0.20",
    "orjson>=3.11.0",
    "structlog>=25.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "testcontainers[postgres]>=4.15.0",
    "ruff>=0.16.0",
    "mypy>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beff"]

# ─────────────────────────────────────────────────────────────
# Ruff
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "DTZ",       # flake8-datetimez — bans naive datetimes, see note below
    "T20",       # flake8-print
    "SIM",       # flake8-simplify
    "TID",       # flake8-tidy-imports
    "RUF",       # ruff-specific
    "ASYNC",     # flake8-async
    "S",         # bandit security
]
ignore = [
    "S101",  # assert is fine in tests
]

# DTZ is deliberately enabled: it catches `datetime.utcnow()`, which is
# deprecated in Python 3.12. Always use `datetime.now(UTC)`.

[tool.ruff.lint.per-file-ignores]
# Hardcoded credentials are fine in tests. Covers both the co-located unit
# tests under src/ and the integration tests under tests/.
"**/test_*.py" = ["S105", "S106"]
"tests/**" = ["S105", "S106"]

[tool.ruff.lint.flake8-tidy-imports]
# Relative imports break when modules move. Absolute imports only.
ban-relative-imports = "all"

# ─────────────────────────────────────────────────────────────
# mypy — strict
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
# Unit tests are co-located with the code they cover (src/**/test_*.py), so a
# unit folder holds implementation + barrel + test and is movable as a whole.
# `tests/` holds fixtures and integration tests, which span units and belong to
# no single one.
testpaths = ["src", "tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: requires a real database (testcontainers)",
]

[tool.coverage.run]
source = ["src/beff"]
branch = true
# Co-located tests live under src/, so they must be excluded from the measured
# source or they would inflate coverage by counting themselves.
omit = ["*/migrations/*", "*/test_*.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
