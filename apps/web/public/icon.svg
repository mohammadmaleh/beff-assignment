<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Beff">
  <!--
    The tolerance band, at favicon size: the in-spec window as a bar, the two
    limit marks that bound it, and the reading sitting inside. It is the
    product's signature element reduced to the fewest strokes that still read
    at 16px, so the tab icon and the landing page are recognisably the same
    idea rather than a logo bolted onto a product.

    `#476f95` is `color-brand-default` from packages/tokens. Hardcoded because a
    metadata file is not compiled with the stylesheet and cannot see a custom
    property; if the brand hue moves, this moves with it.
  -->
  <rect width="32" height="32" rx="6" fill="#1c1f22" />
  <rect x="7" y="15" width="18" height="2" rx="1" fill="#476f95" />
  <rect x="7" y="11" width="1.5" height="10" rx="0.75" fill="#8a9299" />
  <rect x="23.5" y="11" width="1.5" height="10" rx="0.75" fill="#8a9299" />
  <rect x="14.5" y="9" width="2" height="14" rx="1" fill="#f2f4f5" />
</svg>
